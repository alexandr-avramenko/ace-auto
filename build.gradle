plugins {
    id 'java'
    id("io.qameta.allure") version "3.0.2"
    id("io.freefair.lombok") version "8.11"
}

group = 'com.aceguardian'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
//    runtimeOnly "org.aspectj:aspectjweaver:1.9.25.1"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation 'org.assertj:assertj-core:3.27.7'
    implementation 'io.qameta.allure:allure-junit-platform:2.27.0'
    implementation 'com.microsoft.playwright:playwright:1.58.0'

    implementation 'com.github.automatedowl:allure-environment-writer:1.0.0'

    //logging
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'ch.qos.logback:logback-classic:1.5.32'
}

test {
    useJUnitPlatform()
}